const {
  getCompetition
} = require("../lib/competitions");

const {
  getScoreboard
} = require("../lib/espn");

const {
  normalizeTeamName
} = require("../lib/teams");

const { DateTime } = require("luxon");

/* =========================================================
   FINESTRA PARTITE
   GIOVEDÌ → MARTEDÌ
========================================================= */

function getNextMatchWindow() {
  const now = DateTime.now().setZone("Europe/Rome");

  /*
   * 1 = lunedì
   * 2 = martedì
   * 3 = mercoledì
   * 4 = giovedì
   * 5 = venerdì
   * 6 = sabato
   * 7 = domenica
   */

  let start;

  if (now.weekday >= 4) {
    /*
     * Da giovedì a domenica:
     * prendiamo il giovedì della settimana corrente.
     */
    start = now.startOf("day").minus({
      days: now.weekday - 4
    });
  } else {
    /*
     * Lunedì, martedì e mercoledì:
     * prendiamo il giovedì precedente.
     */
    start = now.startOf("day").minus({
      days: now.weekday + 3
    });
  }

  /*
   * Giovedì + 5 giorni = martedì
   */
  const end = start.plus({
    days: 5
  });

  return {
    start,
    end
  };
}

/* =========================================================
   DATA ESPN
========================================================= */

function formatDateForESPN(date) {
  return date.toFormat("yyyyMMdd");
}

/* =========================================================
   FORMAT PARTITA
========================================================= */

function formatMatch(event, competition) {
  const competitionInfo =
    event.competitions?.[0];

  if (!competitionInfo) {
    return null;
  }

  const homeTeam =
    competitionInfo.competitors?.find(
      team =>
        team.homeAway === "home"
    );

  const awayTeam =
    competitionInfo.competitors?.find(
      team =>
        team.homeAway === "away"
    );

  if (!homeTeam || !awayTeam) {
    return null;
  }

  const dateTime =
    DateTime.fromISO(
      event.date,
      {
        zone: "utc"
      }
    ).setZone("Europe/Rome");

  if (!dateTime.isValid) {
    return null;
  }

  /*
   * pre = partita non ancora iniziata
   * in  = partita in corso
   * post = partita terminata
   */
  const state =
    event.status?.type?.state || null;

  const isStarted =
    state !== "pre";

  return {
    id: String(event.id),

    date:
      dateTime.toFormat(
        "dd/MM/yyyy"
      ),

    time:
      dateTime.toFormat(
        "HH:mm"
      ),

    timezone:
      "Europe/Rome",

    competition: {
      id:
        competition.id,

      name:
        competition.name
    },

    home: {
      name:
        normalizeTeamName(
          homeTeam.team?.displayName ||
          homeTeam.team?.name ||
          "Squadra casa"
        ),

      score:
        isStarted
          ? (homeTeam.score ?? "-")
          : "-",

      logo:
        homeTeam.team?.logo ||
        homeTeam.team?.logos?.[0]?.href ||
        null
    },

    away: {
      name:
        normalizeTeamName(
          awayTeam.team?.displayName ||
          awayTeam.team?.name ||
          "Squadra trasferta"
        ),

      score:
        isStarted
          ? (awayTeam.score ?? "-")
          : "-",

      logo:
        awayTeam.team?.logo ||
        awayTeam.team?.logos?.[0]?.href ||
        null
    },

    status: {
      state,

      name:
        event.status?.type?.name ||
        null,

      description:
        event.status?.type?.description ||
        null,

      detail:
        event.status?.type?.detail ||
        null,

      shortDetail:
        event.status?.type?.shortDetail ||
        null,

      clock:
        event.status?.displayClock ||
        null,

      period:
        event.status?.period ||
        null,

      completed:
        event.status?.type?.completed ||
        false
    }
  };
}

/* =========================================================
   MAIN
========================================================= */

module.exports = async (
  req,
  res
) => {
  try {

    /* -----------------------------------------------------
       METODO
    ----------------------------------------------------- */

    if (req.method !== "GET") {
      return res.status(405).json({
        success: false,
        error:
          "Metodo non consentito"
      });
    }

    /* -----------------------------------------------------
       PARAMETRO COMPETIZIONE
    ----------------------------------------------------- */

    const competitionId =
      req.query?.competition;

    if (!competitionId) {
      return res.status(400).json({
        success: false,
        error:
          "Parametro competition obbligatorio"
      });
    }

    /* -----------------------------------------------------
       COMPETIZIONE
    ----------------------------------------------------- */

    const competition =
      getCompetition(
        competitionId
      );

    if (!competition) {
      return res.status(404).json({
        success: false,
        error:
          "Competizione non trovata"
      });
    }

    if (!competition.espnLeague) {
      return res.status(400).json({
        success: false,
        error:
          "Codice ESPN della competizione non ancora configurato"
      });
    }

    /* -----------------------------------------------------
       FINESTRA
       GIOVEDÌ → MARTEDÌ
    ----------------------------------------------------- */

    const {
      start,
      end
    } = getNextMatchWindow();

    /* -----------------------------------------------------
       RICHIESTE ESPN
    ----------------------------------------------------- */

    const requests = [];

    let currentDate = start;

    while (
      currentDate <= end
    ) {

      const date =
        formatDateForESPN(
          currentDate
        );

      /*
       * Ogni giorno viene richiesto
       * separatamente a ESPN.
       *
       * In questo modo recuperiamo:
       *
       * - partite terminate
       * - partite in corso
       * - partite future
       */

      requests.push(
        getScoreboard(
          competition.espnLeague,
          date
        )
      );

      currentDate =
        currentDate.plus({
          days: 1
        });
    }

    /* -----------------------------------------------------
       ATTENDI TUTTE LE RISPOSTE
    ----------------------------------------------------- */

    const responses =
      await Promise.all(
        requests
      );

    /* -----------------------------------------------------
       ESTRAI EVENTI
    ----------------------------------------------------- */

    const events =
      responses.flatMap(
        response =>
          Array.isArray(
            response?.events
          )
            ? response.events
            : []
      );

    /* -----------------------------------------------------
       FORMATTA PARTITE
    ----------------------------------------------------- */

    const matches =
      events
        .map(
          event =>
            formatMatch(
              event,
              competition
            )
        )
        .filter(Boolean);

    /* -----------------------------------------------------
       ELIMINA DUPLICATI
    ----------------------------------------------------- */

    const uniqueMatches =
      Array.from(
        new Map(
          matches.map(
            match => [
              match.id,
              match
            ]
          )
        ).values()
      );

    /* -----------------------------------------------------
       ORDINA CRONOLOGICAMENTE
    ----------------------------------------------------- */

    uniqueMatches.sort(
      (a, b) => {

        const dateA =
          DateTime.fromFormat(
            `${a.date} ${a.time}`,
            "dd/MM/yyyy HH:mm",
            {
              zone:
                "Europe/Rome"
            }
          );

        const dateB =
          DateTime.fromFormat(
            `${b.date} ${b.time}`,
            "dd/MM/yyyy HH:mm",
            {
              zone:
                "Europe/Rome"
            }
          );

        return (
          dateA.toMillis() -
          dateB.toMillis()
        );
      }
    );

    /* -----------------------------------------------------
       RISPOSTA
    ----------------------------------------------------- */

    res.setHeader(
      "Cache-Control",
      "s-maxage=15, stale-while-revalidate=30"
    );

    return res.status(200).json({

      success: true,

      source:
        "ESPN",

      timezone:
        "Europe/Rome",

      /*
       * Finestra utilizzata
       */
      window: {

        from:
          start.toFormat(
            "dd/MM/yyyy"
          ),

        to:
          end.toFormat(
            "dd/MM/yyyy"
          )
      },

      league:
        competition.espnLeague,

      count:
        uniqueMatches.length,

      /*
       * Tutte le partite:
       *
       * PRE  = future
       * IN   = live
       * POST = terminate
       */
      matches:
        uniqueMatches

    });

  } catch (error) {

    console.error(
      "ESPN SCOREBOARD ERROR:",
      error
    );

    return res.status(500).json({

      success: false,

      source:
        "ESPN",

      error:
        error?.message ||
        "Errore durante il recupero delle partite ESPN"
    });
  }
};

✅ Cosa farà adesso

Se siamo nella settimana 27 agosto → 1 settembre, l'API controllerà esattamente:

27/08 giovedì
28/08 venerdì
29/08 sabato
30/08 domenica
31/08 lunedì
01/09 martedì

E restituirà tutte le partite trovate da ESPN, senza eliminare quelle già terminate.

Quindi, per esempio:

- "pre" → ⚪ futura
- "in" → 🔴 in corso
- "post" → 🟢 terminata

Inoltre il risultato viene ordinato automaticamente in base a data + ora italiana.
